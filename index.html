<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azuaga Barbería</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap">
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6b6b;--line:#e4e4e4;--card:#f5f5f5;--y:#f5d547;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f4f4f4;--mut:#9a9a9a;--line:#2c2c2c;--card:#1c1c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--fg:#f4f4f4;--mut:#9a9a9a;--line:#2c2c2c;--card:#1c1c1c;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.w{max-width:480px;margin:0 auto;padding:20px 20px 40px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}h2{font-size:20px;margin:24px 0 10px}
.m{color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.b{display:block;width:100%;padding:18px;border-radius:14px;border:0;background:var(--card);font-weight:600;font-size:17px;text-align:left;margin-bottom:10px}
.b.c{text-align:center}
.y{background:var(--y);color:#111;text-align:center}
.o{display:flex;justify-content:space-between;align-items:center;gap:12px}
.l{background:none;border:0;color:var(--mut);font-size:14px;padding:6px 0;text-decoration:underline}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{flex:none;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:none;text-align:center;font-size:14px}
.chip.s{border-color:var(--fg);font-weight:600}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g .chip{font-size:16px}.g .chip.s{background:var(--y);color:#111;border-color:var(--y)}
input,select{font:inherit;width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);margin:6px 0 12px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px}
.nx{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;padding:12px;border-radius:12px;border:0;background:var(--card);font-weight:600}
.tabs button.s{background:var(--fg);color:var(--bg)}
.r{display:flex;gap:8px}.r>*{flex:1}
.sm{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:none;font-size:14px}
.pr{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:27px;font-weight:600;letter-spacing:.03em;font-variant-numeric:lining-nums;white-space:nowrap}
.pr small{font:500 12px Inter,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.08em;margin-right:7px;color:var(--mut)}
.w.h{box-sizing:border-box;display:flex;flex-direction:column;min-height:100svh}
.seal{margin-top:auto;padding-top:56px;text-align:center}
.seal img{width:116px;opacity:.55}
.hx{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:58px;font-weight:600;line-height:.98;letter-spacing:-.01em;margin:28px 0 16px}
.bc{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:34px 0}
.bc:last-of-type{border-bottom:1px solid var(--line)}
.bc span{display:block}.bc:active .bn{opacity:.55}
.bn{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:48px;font-weight:600;line-height:1.1;margin:6px 0 8px}
.chip.rv{border-color:#d33;color:#d33;cursor:default;font-size:14px;padding:8px 4px}.chip.rv span{font-size:12px}
.ok{text-align:center;padding:40px 0}.ok .big{font-size:22px;font-weight:700;margin:16px 0 6px}
</style></head><body><div class="w" id="app"></div>

let S={shop:'',cur:'Gs ',open:'09:00',close:'19:00',off:[],slot:30,svcs:[],bars:[],rem:{on:true,min:30},wa:'',bk:[],q:[],log:[]},TOK='',_n=Date.now()%1e9;
const nid=()=>++_n;
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Error de conexión'),{status:r.status});return j}
async function load(){if(authed)S=await api('GET','/api/admin/state');else{const j=await api('GET','/api/state');S=Object.assign(j,{bk:j.busy,q:[],log:[]})}}
let st;function save(){if(!authed)return;clearTimeout(st);st=setTimeout(()=>api('PUT','/api/admin/settings',{shop:S.shop,cur:S.cur,open:S.open,close:S.close,off:S.off,slot:S.slot,svcs:S.svcs,bars:S.bars,rem:S.rem,wa:S.wa}).catch(e=>alert('No se pudo guardar: '+e.message)),400)}
async function login(){try{const j=await api('POST','/api/admin/login',{pin:$('pin').value});TOK=j.token;authed=true;await load();R()}catch(e){$('err').textContent=e.status===429?'Demasiados intentos. Esperá unos minutos.':'PIN incorrecto'}}
async function logout(){authed=false;TOK='';mode='c';try{await load()}catch(e){}R()}
async function cancel(id){try{await api('DELETE','/api/admin/booking/'+id);await load();R()}catch(e){alert(e.message)}}
function seen(){S.bk.forEach(b=>delete b.nw);R();api('POST','/api/admin/seen').catch(()=>{})}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const tm=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const fm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fd=k=>new Date(k+'T00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
const fs=k=>{const d=new Date(k+'T00:00');return d.toLocaleDateString('es',{weekday:'short'}).replace('.','')+' '+d.getDate()};
const money=n=>S.cur+Number(n).toLocaleString('es');
const price=n=>`<span class="pr"><small>${esc(S.cur.trim())}</small>${Number(n).toLocaleString('es')}</span>`;
function days(n){const o=[];const d=new Date();for(let i=0;i<n;i++){if(!S.off.includes(d.getDay()))o.push(dk(d));d.setDate(d.getDate()+1)}return o}
function slots(b,d,m,ign){const o=[],now=new Date(),today=dk(now)===d,nm=now.getHours()*60+now.getMinutes();
for(let t=tm(S.open);t+m<=tm(S.close);t+=S.slot){if(today&&t<=nm)continue;
if(!S.bk.some(x=>x.b==b&&x.d==d&&x.id!=ign&&t<x.t+x.m&&x.t<t+m))o.push(t)}return o}
function allSlots(b,d,m){const f=slots(b,d,m),o=[],now=new Date(),today=dk(now)===d,nm=now.getHours()*60+now.getMinutes();for(let t=tm(S.open);t+m<=tm(S.close);t+=S.slot){if(today&&t<=nm)continue;o.push({t,free:f.includes(t)})}return o}
function nextFree(b){const mm=Math.min(...S.svcs.map(s=>s.m)),td=dk(new Date());for(const d of days(14)){const f=allSlots(b,d,mm).find(o=>o.free);if(f)return (d===td?'Hoy':fs(d))+' · '+fm(f.t)}return 'Sin horarios'}
function fchips(){return `<div class="chips"><button class="chip ${!fb?'s':''}" onclick="fb=0;R()">Todos</button>${S.bars.map(b=>`<button class="chip ${fb==b.id?'s':''}" onclick="fb=${b.id};R()">${esc(b.n)}</button>`).join('')}</div>`}
function summary(){const td=dk(new Date());return `<h2 style="margin-top:0">Resumen</h2>`+S.bars.map(b=>{const l=S.bk.filter(x=>x.b==b.id),inc=l.reduce((a,x)=>a+(+x.p||0),0);return `<div class="card"><b>${esc(b.n)}</b><div class="m">${b.wa?esc(b.wa):'Sin WhatsApp cargado'}</div><div class="r" style="margin-top:10px"><div><div class="pr">${l.filter(x=>x.d===td).length}</div><span class="m">hoy</span></div><div><div class="pr">${l.filter(x=>x.d>td).length}</div><span class="m">próximos</span></div><div><div class="pr">${Number(inc).toLocaleString('es')}</div><span class="m">${esc(S.cur.trim())} en reservas</span></div></div></div>`}).join('')}
function qlist(){const l=S.q.slice(-10).reverse();return `<h2>Mensajes de WhatsApp</h2><p class="m">Últimos mensajes.</p>`+(l.map(q=>`<div class="card"><span class="m">Para ${esc(q.to)} · ${esc(q.st)}</span><br>${esc(q.text)}</div>`).join('')||'<p class="m">Ninguno.</p>')}
function nbanner(){const n=S.bk.filter(b=>b.nw);if(!n.length)return'';return `<div class="card" style="background:var(--y);color:#111"><b>🔔 ${n.length} reserva${n.length>1?'s':''} nueva${n.length>1?'s':''}</b>${n.map(x=>`<div>${esc(x.name)} · ${fs(x.d)} ${fm(x.t)} · ${esc(x.sn)} · ${esc(bar(x.b))}</div>`).join('')}<button class="sm" style="margin-top:10px;color:#111;border-color:#111" onclick="seen()">Entendido</button></div>`}
const sorted=l=>l.slice().sort((a,b)=>(a.d+fm(a.t)).localeCompare(b.d+fm(b.t)));

/* ---------- Cliente ---------- */
let fb=0,C={step:0},mode='c',tab='hoy',authed=false,F=null;
function R(){$('app').className='w'+(mode==='c'&&C.step===0?' h':'');$('app').innerHTML=mode==='c'?vClient():(authed?vAdmin():vPin())}
function hdr(back){return `<div class="top"><div>${back?`<button class="l" style="text-decoration:none;font-size:22px" onclick="C.step=Math.max(0,C.step-1);R()">←</button>`:`<b>BarberApp</b>`}</div><button class="l" onclick="mode='a';R()">Panel</button></div>`}
function vClient(){
if(C.step===0)return hdr()+`<h1>Reservá turno</h1><p class="m">Elegí tu barbero</p>`+S.bars.map(b=>`<button class="b" onclick="C.bar=${b.id};C.step=1;R()">${esc(b.n)}</button>`).join('')+`<div class="seal"><img src="${LOGO}" alt="Azuaga Barbería"></div>`;
if(C.step===1)return hdr(1)+`<h1>Elegí tu servicio</h1>`+S.svcs.map(s=>`<button class="b o" onclick="C.svc=${s.id};C.step=2;R();load().then(R).catch(()=>{})"><span>${esc(s.n)}<br><span class="m">${s.m} min</span></span>${price(s.p)}</button>`).join('');
const sv=S.svcs.find(s=>s.id===C.svc);
if(C.step===2){const ds=days(14);C.date=C.date&&ds.includes(C.date)?C.date:ds[0];const sl=allSlots(C.bar,C.date,sv.m);
return hdr(1)+`<h1>¿Cuándo?</h1><div class="chips">${ds.map(d=>`<button class="chip ${d===C.date?'s':''}" onclick="C.date='${d}';C.time=null;R()">${fs(d)}</button>`).join('')}</div>`+
(sl.length?`<div class="g">${sl.map(o=>o.free?`<button class="chip ${o.t===C.time?'s':''}" onclick="C.time=${o.t};R()">${fm(o.t)}</button>`:`<button class="chip rv" disabled>${fm(o.t)}<br><span>Reservado</span></button>`).join('')}</div>`:`<p class="m">No hay horarios este día.</p>`)+
`<div style="height:20px"></div><button class="b y" ${C.time==null?'disabled style="opacity:.4"':''} onclick="C.step=3;R()">Continuar</button>`}
if(C.step===3)return hdr(1)+`<h1>Tus datos</h1><div class="card">${esc(sv.n)} · ${money(sv.p)}<br><span class="m">${esc(bar(C.bar))} · ${fd(C.date)}, ${fm(C.time)}</span></div>
<label class="m">Nombre</label><input autocomplete="name" value="${esc(C.name||'')}" oninput="C.name=this.value">
<label class="m">WhatsApp</label><input type="tel" inputmode="tel" placeholder="+595 9xx xxx xxx" autocomplete="tel" value="${esc(C.wa||'')}" oninput="C.wa=this.value">
<p class="m" style="margin:0 0 4px">Al confirmar aceptás recibir avisos de tu turno por WhatsApp.</p><p class="m" id="err" style="min-height:20px"></p><button class="b y" onclick="confirmC()">Confirmar turno</button>`;
return `<div class="ok"><div style="font-size:44px">✂️</div><div class="big">¡Listo, ${esc(C.name)}!</div><div>${esc(sv.n)}<br>${fd(C.date)} · ${fm(C.time)}</div><p class="m">Te enviaremos la confirmación y un recordatorio por WhatsApp.</p></div><button class="b c" onclick="C={step:0};R()">Hacer otra reserva</button>`}
async function confirmC(){const sv=S.svcs.find(s=>s.id===C.svc),wa=(C.wa||'').replace(/[^\d+]/g,'');
if(!(C.name||'').trim()||wa.replace(/\D/g,'').length<8){$('err').textContent='Ingresá tu nombre y un WhatsApp válido.';return}
if(!slots(C.bar,C.date,sv.m).includes(C.time)){C.step=2;C.time=null;R();return}
if(C.busy)return;C.busy=1;try{await api('POST','/api/book',{svc:sv.id,b:C.bar,d:C.date,t:C.time,name:C.name.trim(),wa});C.step=4;await load();R()}catch(e){if(e.status===409){await load();C.step=2;C.time=null;R()}else $('err').textContent=e.message}finally{C.busy=0}}

/* ---------- Barbero ---------- */
function vPin(){return `<div class="top"><button class="l" onclick="mode='c';R()">← Volver</button></div><h1>Panel del dueño</h1><p class="m">Ingresá tu PIN</p><input type="password" inputmode="numeric" id="pin" placeholder="PIN"><p class="m" id="err"></p><button class="b y" onclick="login()">Entrar</button>`}
function bar(id){return (S.bars.find(b=>b.id==id)||{}).n||''}
function row(x,act){return `<div class="card"><div class="o"><div><b>${fm(x.t)}</b> · ${esc(x.name)}<br><span class="m">${esc(x.sn)}${S.bars.length>1?' · '+esc(bar(x.b)):''} · ${esc(x.wa)}</span></div>${act?`<div class="r" style="flex:none"><button class="sm" onclick="edit(${x.id})">Mover</button><button class="sm" onclick="if(confirm('¿Cancelar este turno?'))cancel(${x.id})">Cancelar</button></div>`:''}</div></div>`}
function vAdmin(){
const tabs=`<div class="top"><b>${esc(S.shop)}</b><button class="l" onclick="logout()">Salir</button></div><div class="tabs">${[['hoy','Hoy'],['ag','Agenda'],['lg','Registro'],['aj','Ajustes']].map(t=>`<button class="${tab===t[0]?'s':''}" onclick="tab='${t[0]}';F=null;R()">${t[1]}</button>`).join('')}</div>`;
if(F)return tabs+vForm();
const td=dk(new Date());
if(tab==='hoy'){const l=sorted(S.bk.filter(b=>b.d===td&&(!fb||b.b==fb))),nm=new Date().getHours()*60+new Date().getMinutes(),nx=l.find(b=>b.t>=nm);
return tabs+nbanner()+fchips()+`<div class="card nx"><span style="opacity:.7;font-size:14px">Próximo cliente</span><div style="font-size:22px;font-weight:700">${nx?fm(nx.t)+' · '+esc(nx.name):'Sin más turnos hoy'}</div>${nx?`<span style="opacity:.7">${esc(nx.sn)}</span>`:''}</div>
<button class="b y" onclick="edit(0)">+ Agregar reserva</button><h2>Turnos de hoy</h2>`+(l.map(x=>row(x,1)).join('')||'<p class="m">Nada por ahora.</p>')}
if(tab==='ag'){const l=sorted(S.bk.filter(b=>b.d>td&&(!fb||b.b==fb))),g={};l.forEach(x=>(g[x.d]=g[x.d]||[]).push(x));
return tabs+fchips()+`<button class="b y" onclick="edit(0)">+ Agregar reserva</button>`+(Object.keys(g).map(d=>`<h2 style="text-transform:capitalize">${fd(d)}</h2>`+g[d].map(x=>row(x,1)).join('')).join('')||'<p class="m">No hay turnos próximos.</p>')}
if(tab==='lg')return tabs+summary()+`<h2>Registro</h2>`+(S.log.map(e=>`<div class="card"><span class="m">${new Date(e.at).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><br>${esc(e.txt)}</div>`).join('')||'<p class="m">Sin movimientos todavía.</p>')+qlist();
const cl={};S.bk.forEach(b=>cl[b.wa]=b.name);
return tabs+`<h2>Barbería</h2><input value="${esc(S.shop)}" onchange="S.shop=this.value;save()" placeholder="Nombre">
<div class="r"><div><span class="m">Abre</span><input type="time" value="${S.open}" onchange="S.open=this.value;save()"></div><div><span class="m">Cierra</span><input type="time" value="${S.close}" onchange="S.close=this.value;save()"></div></div>
<span class="m">Días de descanso</span><div class="chips" style="margin-top:6px">${['D','L','M','M','J','V','S'].map((n,i)=>`<button class="chip ${S.off.includes(i)?'s':''}" onclick="S.off=S.off.includes(${i})?S.off.filter(x=>x!==${i}):S.off.concat(${i});save();R()">${n}</button>`).join('')}</div>
<h2>Servicios</h2>${S.svcs.map((s,i)=>`<div class="card"><input value="${esc(s.n)}" onchange="S.svcs[${i}].n=this.value;save()"><div class="r"><input type="number" value="${s.m}" onchange="S.svcs[${i}].m=+this.value;save()"><input type="number" value="${s.p}" onchange="S.svcs[${i}].p=+this.value;save()"><button class="sm" style="margin:6px 0 12px" onclick="S.svcs.splice(${i},1);save();R()">Quitar</button></div><span class="m">minutos · precio</span></div>`).join('')}
<button class="b c" onclick="S.svcs.push({id:nid(),n:'Nuevo servicio',m:30,p:0});save();R()">+ Servicio</button>
<h2>Barberos</h2><p class="m">Nombre y WhatsApp. Cada barbero recibe en ese número el aviso de sus reservas.</p>${S.bars.map((b,i)=>`<div class="r"><input value="${esc(b.n)}" onchange="S.bars[${i}].n=this.value;save()"><input type="tel" placeholder="WhatsApp +595..." value="${esc(b.wa||'')}" onchange="S.bars[${i}].wa=this.value;save()">${S.bars.length>1?`<button class="sm" style="margin:6px 0 12px;flex:none" onclick="S.bars.splice(${i},1);save();R()">Quitar</button>`:''}</div>`).join('')}
<button class="b c" onclick="S.bars.push({id:nid(),n:'Barbero '+(S.bars.length+1)});save();R()">+ Barbero</button>
<h2>Recordatorios por WhatsApp</h2><button class="b o" onclick="S.rem.on=!S.rem.on;save();R()"><span>Recordatorios automáticos</span><span>${S.rem.on?'Activados':'Apagados'}</span></button>
<span class="m">Minutos antes del turno</span><input type="number" value="${S.rem.min}" onchange="S.rem.min=+this.value;save()">
<span class="m">Número de WhatsApp de la barbería</span><input type="tel" value="${esc(S.wa)}" onchange="S.wa=this.value;save()">
<p class="m">${S.wa_on?'WhatsApp conectado.':'WhatsApp sin conectar: faltan las claves en el servidor.'} Mensajes pendientes: ${S.pend||0}.</p>
<h2>Clientes (${Object.keys(cl).length})</h2>${Object.keys(cl).map(w=>`<div class="card">${esc(cl[w])}<br><span class="m">${esc(w)}</span></div>`).join('')||'<p class="m">Todavía no hay clientes.</p>'}
`}
function edit(id){const x=S.bk.find(b=>b.id===id);F=x?{...x,old:1}:{id:0,s:S.svcs[0].id,b:S.bars[0].id,d:days(14)[0],t:null,name:'',wa:''};R()}
function vForm(){const sv=S.svcs.find(s=>s.id==F.s)||S.svcs[0],sl=slots(F.b,F.d,sv.m,F.id);if(F.t!=null&&F.old&&!sl.includes(F.t)&&F.d===F.od)sl.push(F.t);if(!F.od)F.od=F.d;
return `<h2 style="margin-top:0">${F.old?'Modificar':'Nueva'} reserva</h2>
<select onchange="F.s=+this.value;F.t=null;R()">${S.svcs.map(s=>`<option value="${s.id}" ${s.id==F.s?'selected':''}>${esc(s.n)} · ${s.m} min</option>`).join('')}</select>
${S.bars.length>1?`<select onchange="F.b=+this.value;F.t=null;R()">${S.bars.map(b=>`<option value="${b.id}" ${b.id==F.b?'selected':''}>${esc(b.n)}</option>`).join('')}</select>`:''}
<input type="date" value="${F.d}" onchange="F.d=this.value;F.t=null;R()">
<select onchange="F.t=+this.value"><option value="">Horario</option>${sorted2(sl).map(t=>`<option value="${t}" ${t===F.t?'selected':''}>${fm(t)}</option>`).join('')}</select>
<input placeholder="Nombre" value="${esc(F.name)}" oninput="F.name=this.value"><input type="tel" placeholder="WhatsApp" value="${esc(F.wa)}" oninput="F.wa=this.value">
<p class="m" id="err"></p><button class="b y" onclick="saveF()">Guardar</button><button class="b c" onclick="F=null;R()">Cancelar</button>`}
const sorted2=a=>a.slice().sort((x,y)=>x-y);
async function saveF(){const sv=S.svcs.find(s=>s.id==F.s),wa=F.wa.replace(/[^\d+]/g,'');
if(!F.name.trim()||wa.replace(/\D/g,'').length<8||F.t==null||F.t===''){$('err').textContent='Completá nombre, WhatsApp y horario.';return}
if(S.bk.some(x=>x.b==F.b&&x.d==F.d&&x.id!=F.id&&F.t<x.t+x.m&&x.t<F.t+sv.m)){$('err').textContent='Ese horario ya está ocupado.';return}
try{await api('POST','/api/admin/booking',{id:F.old?F.id:0,svc:sv.id,b:+F.b,d:F.d,t:+F.t,name:F.name.trim(),wa});F=null;await load();R()}catch(e){$('err').textContent=e.message}}
load().then(R).catch(()=>{$('app').innerHTML='<p class="m" style="padding:20px">No se pudo cargar. Revisá tu conexión y recargá.</p>'});
</script></body></html>
